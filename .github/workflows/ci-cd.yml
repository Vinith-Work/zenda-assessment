name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build image (runs the tests)
        run: docker build -t fee-planner:test .

      - name: Save image to a file
        run: docker save fee-planner:test | gzip > image.tar.gz

      - name: Upload image for the push job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build image
          path: image.tar.gz
  
  push:
    name: Push to ACR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8.0.2
        with:
          name: build image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load
