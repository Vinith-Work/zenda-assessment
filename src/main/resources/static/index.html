<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fee Planner</title>
  <style>
    :root { --ink: #1f2933; --muted: #5f6b7a; --line: #d9dee5; --accent: #0f766e; --bg: #f7f8fa; --ok: #15803d; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 1.6rem; margin: 0; }
    .badge { font-size: .85rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
    .badge.up { color: var(--ok); border-color: var(--ok); }
    .badge.down { color: var(--bad); border-color: var(--bad); }
    p.lead { color: var(--muted); margin: 6px 0 24px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #fff;
           border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
    input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #fff; }
    button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; align-self: end; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 600; border-bottom: 0; }
    .error { color: var(--bad); margin-top: 16px; }
    footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
    code { font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>School fee instalment planner</h1>
    <span id="health" class="badge">checking…</span>
  </header>
  <p class="lead">Split an annual fee into equal instalments. Leftover paise go to the first instalments, so the plan always adds up to the exact fee.</p>

  <form id="plan-form">
    <label>Total fee (₹)
      <input name="amount" type="number" min="1" step="0.01" value="45000" required>
    </label>
    <label>Instalments
      <input name="instalments" type="number" min="1" max="12" value="3" required>
    </label>
    <label>Frequency
      <select name="frequency">
        <option value="MONTHLY">Monthly</option>
        <option value="QUARTERLY" selected>Quarterly</option>
        <option value="HALF_YEARLY">Half-yearly</option>
      </select>
    </label>
    <label>First due date
      <input name="firstDueDate" type="date">
    </label>
    <button type="submit">Plan instalments</button>
  </form>

  <div id="error" class="error" hidden></div>
  <table id="result" hidden>
    <thead><tr><th>#</th><th>Due date</th><th class="num">Amount (₹)</th></tr></thead>
    <tbody></tbody>
    <tfoot><tr><td></td><td>Total</td><td class="num" id="total"></td></tr></tfoot>
  </table>

  <footer>
    <div>Served by <code id="served-by">…</code> · version <code id="version">…</code></div>
    <div>API: <code>/api/plans</code> · <code>/api/health</code> · <code>/api/info</code></div>
  </footer>
</main>
<script>
  const rupees = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const form = document.getElementById('plan-form');
  const errorBox = document.getElementById('error');
  const table = document.getElementById('result');

  form.firstDueDate.value = new Date().toISOString().slice(0, 10);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const params = new URLSearchParams(new FormData(form));
    if (!form.firstDueDate.value) params.delete('firstDueDate');
    errorBox.hidden = true;
    try {
      const response = await fetch('/api/plans?' + params);
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || response.statusText);
      const rows = body.schedule.map(i =>
        `<tr><td>${i.number}</td><td>${i.dueDate}</td><td class="num">${rupees.format(i.amount)}</td></tr>`);
      table.tBodies[0].innerHTML = rows.join('');
      document.getElementById('total').textContent = rupees.format(body.totalAmount);
      table.hidden = false;
    } catch (e) {
      table.hidden = true;
      errorBox.textContent = e.message;
      errorBox.hidden = false;
    }
    loadInfo();
  });

  async function loadHealth() {
    const badge = document.getElementById('health');
    try {
      const response = await fetch('/api/health');
      const body = await response.json();
      badge.textContent = 'health: ' + body.status;
      badge.className = 'badge ' + (body.status === 'UP' ? 'up' : 'down');
    } catch (e) {
      badge.textContent = 'health: unreachable';
      badge.className = 'badge down';
    }
  }

  async function loadInfo() {
    try {
      const info = await (await fetch('/api/info')).json();
      document.getElementById('served-by').textContent = info.servedBy;
      document.getElementById('version').textContent = info.version;
    } catch (e) { /* footer stays as is */ }
  }

  loadHealth();
  loadInfo();
</script>
</body>
</html>
