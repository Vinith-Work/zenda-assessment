apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fee-planner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vinith-Work/zenda-assessment.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: assessment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true